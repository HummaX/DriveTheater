[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drivetheater"
version = "0.1.0"
description = "A play-first self-hosted media library"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "google-auth>=2.35,<3",
  "requests>=2.32,<3",
  "yt-dlp>=2025.1.26",
  "psutil>=6,<8",
  "gdown>=5.2,<7",
  "gallery-dl>=1.30,<2",
  "faster-whisper>=1.1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["drivetheater*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["backend"]
